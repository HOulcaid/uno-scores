<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d72e2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Uno Scores</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e6e2d8;--red:#d72e2e;--yel:#f5b800;--grn:#2a9d4a;--blu:#2467d6;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#202024;--ink:#f2f2f4;--mute:#9a9aa2;--line:#303036}}
:root[data-theme="dark"]{--bg:#141416;--card:#202024;--ink:#f2f2f4;--mute:#9a9aa2;--line:#303036}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:0 14px 110px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 8px}
h1{font-size:24px;margin:0;letter-spacing:-.5px}
h1 span{display:inline-block;background:var(--red);color:#fff;border-radius:8px;padding:0 8px;transform:rotate(-4deg);margin-right:6px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pos{width:30px;font-size:20px;text-align:center;font-weight:700;color:var(--mute)}
.name{flex:1;font-weight:600;font-size:17px}
.sub{font-size:12px;color:var(--mute);font-weight:400;margin-top:2px}
.pts{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.top .pts{color:var(--red)}
button{font:inherit;border:0;cursor:pointer;color:var(--ink)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red)}
.btn.grn{background:var(--grn);color:#fff;border-color:var(--grn)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1;white-space:nowrap}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--red);color:#fff;border-radius:999px;padding:16px 28px;font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(215,46,46,.4)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;border-radius:999px;padding:3px 9px;background:var(--bg);border:1px solid var(--line)}
.chip b{color:var(--red)}
.rh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.rh button{background:none;color:var(--blu);font-weight:600;padding:4px 8px;font-size:13px}
.rh button.del{color:var(--red)}
.round{padding:12px 14px;border-bottom:1px solid var(--line)}.round:last-child{border-bottom:0}
.empty{padding:26px;text-align:center;color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.panel h3{margin:0 0 4px;font-size:20px}
.hint{color:var(--mute);font-size:14px;margin:0 0 12px}
.pick{width:100%;display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:2px solid var(--line);border-radius:14px;margin-bottom:8px;text-align:left}
.pick .rk{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;color:var(--mute)}
.pick.sel{border-color:var(--grn)}
.pick.sel .rk{background:var(--grn);color:#fff}
.pick .nm{flex:1;font-weight:700;font-size:17px}
.pick .gp{font-weight:800;font-size:16px;color:var(--grn)}
.pick .ab{font-size:13px;color:var(--mute)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;display:none}
</style>
</head>
<body>
<header><h1><span>UNO</span>Scores</h1><span id="sync" title="Sync status" style="margin-left:auto;margin-right:10px;font-size:14px;color:#9a9aa2">●</span><button class="btn" id="bShare">Share</button></header>
<h2>Leaderboard</h2>
<div class="card" id="board"></div>
<h2>Rounds</h2>
<div class="card" id="rounds"></div>
<div class="btns"><button class="btn" id="bReset">Reset all scores</button></div>
<button class="fab" id="bNew">+ New round</button>

<div class="sheet" id="edit"><div class="panel">
<h3 id="eTitle">New round</h3>
<p class="hint">Tap players in finishing order (1st → last). Don’t tap anyone who is absent.</p>
<div id="picks"></div>
<div class="btns"><button class="btn" id="eCancel">Cancel</button><button class="btn pri" id="eSave">Save round</button></div>
</div></div>

<div class="sheet" id="share"><div class="panel">
<h3>Share scores</h3>
<p class="hint">Send the current leaderboard to the group.</p>
<div class="btns" style="flex-direction:column">
<button class="btn grn" id="sImg">Share as image</button>
<a class="btn" id="sWa" target="_blank" rel="noopener" style="text-decoration:none;text-align:center;color:var(--ink)">Send text via WhatsApp</a>
<button class="btn" id="sTxt">Share / copy text</button>
<button class="btn" id="sClose">Close</button></div>
</div></div>

<div class="sheet" id="conf"><div class="panel">
<h3 id="cMsg">Sure?</h3>
<div class="btns"><button class="btn" id="cNo">Cancel</button><button class="btn pri" id="cYes">Confirm</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const PLAYERS=["Hafid","Ali","Khalid","Ahmed","Hassan"];
const T5=[10,7,5,3,0],T4=[10,7,5,0],ABS=3,KEY="uno-scores-v1";
/* ===== SHARED SCORES (Firebase Realtime Database, REST) ===== */
const DB="https://uno-scores-3b1a7-default-rtdb.europe-west1.firebasedatabase.app/"; // <-- put your Firebase URL here (no trailing slash)
let rounds=[];
try{rounds=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
const cache=()=>{try{localStorage.setItem(KEY,JSON.stringify(rounds))}catch(e){}};
const setSync=ok=>{const d=document.getElementById("sync");if(d)d.style.color=ok?"#2a9d4a":"#d72e2e"};
async function pull(){
  try{const r=await fetch(DB+"/rounds.json");if(!r.ok)throw 0;const o=await r.json()||{};
    rounds=Object.entries(o).map(([id,v])=>({id,...v})).sort((a,b)=>a.ts-b.ts);cache();render();setSync(true)}
  catch(e){setSync(false)}}
async function api(method,path,body){
  try{const r=await fetch(DB+path+".json",{method,body:body?JSON.stringify(body):undefined});if(!r.ok)throw 0;await pull()}
  catch(e){setSync(false);toast("Offline – change not saved")}}
setInterval(pull,5000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
const $=id=>document.getElementById(id);
const medal=i=>["🥇","🥈","🥉"][i]||(i+1);

function pointsOf(order){ // order: finishing order array
  const t=order.length===5?T5:T4,p={};
  PLAYERS.forEach(n=>p[n]=order.length===4?ABS:0);
  order.forEach((n,i)=>p[n]=t[i]);
  return p;
}
function totals(){
  const s={};PLAYERS.forEach(n=>s[n]={n,pts:0,played:0,wins:0});
  rounds.forEach(r=>{const p=pointsOf(r.order);
    PLAYERS.forEach(n=>{s[n].pts+=p[n];if(r.order.includes(n))s[n].played++});
    s[r.order[0]].wins++});
  return Object.values(s).sort((a,b)=>b.pts-a.pts||b.wins-a.wins||PLAYERS.indexOf(a.n)-PLAYERS.indexOf(b.n));
}
function render(){
  const t=totals();
  $("board").innerHTML=t.map((x,i)=>`<div class="row ${i==0&&x.pts>0?"top":""}"><div class="pos">${medal(i)}</div><div class="name">${x.n}<div class="sub">${x.played} played · ${x.wins} win${x.wins==1?"":"s"}</div></div><div class="pts">${x.pts}</div></div>`).join("");
  $("rounds").innerHTML=rounds.length?rounds.slice().reverse().map((r,k)=>{const idx=rounds.length-1-k,p=pointsOf(r.order);
    const chips=PLAYERS.slice().sort((a,b)=>p[b]-p[a]).map(n=>`<span class="chip">${n} <b>+${p[n]}</b>${r.order.includes(n)?"":" (absent)"}</span>`).join("");
    return `<div class="round"><div class="rh"><span>Round ${idx+1} · ${r.order[0]} won</span><span><button data-e="${idx}">Edit</button><button class="del" data-d="${idx}">Delete</button></span></div><div class="chips">${chips}</div></div>`}).join(""):`<div class="empty">No rounds yet.<br>Tap “New round” to start.</div>`;
}
$("rounds").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.e!==undefined)openEdit(+b.dataset.e);
  if(b.dataset.d!==undefined)ask(`Delete round ${+b.dataset.d+1}?`,()=>api("DELETE","/rounds/"+rounds[+b.dataset.d].id))};

/* edit sheet */
let order=[],editing=-1;
function openEdit(i){editing=i;order=i>=0?rounds[i].order.slice():[];$("eTitle").textContent=i>=0?`Edit round ${i+1}`:"New round";drawPicks();$("edit").classList.add("on")}
function drawPicks(){
  const ok=order.length>=4,p=ok?pointsOf(order):null;
  $("picks").innerHTML=PLAYERS.map(n=>{const k=order.indexOf(n);
    const right=k<0?(order.length>=4?`<span class="ab">Absent +${ABS}</span>`:`<span class="ab">tap</span>`):(ok?`<span class="gp">+${p[n]}</span>`:"");
    return `<button class="pick ${k>=0?"sel":""}" data-n="${n}"><span class="rk">${k>=0?k+1:""}</span><span class="nm">${n}</span>${right}</button>`}).join("");
  $("eSave").style.opacity=ok?1:.4;
}
$("picks").onclick=e=>{const b=e.target.closest("button");if(!b)return;const n=b.dataset.n,k=order.indexOf(n);
  if(k>=0)order.splice(k,1);else order.push(n);drawPicks()};
$("eCancel").onclick=()=>$("edit").classList.remove("on");
$("eSave").onclick=()=>{
  if(order.length<4){toast("At least 4 players needed");return}
  const o=order.slice();$("edit").classList.remove("on");toast("Saving…");
  if(editing>=0)api("PUT","/rounds/"+rounds[editing].id,{ts:rounds[editing].ts,order:o});
  else api("POST","/rounds",{ts:Date.now(),order:o})};
$("bNew").onclick=()=>openEdit(-1);

/* confirm */
let yes=null;
function ask(m,f){$("cMsg").textContent=m;yes=f;$("conf").classList.add("on")}
$("cNo").onclick=()=>$("conf").classList.remove("on");
$("cYes").onclick=()=>{$("conf").classList.remove("on");yes&&yes()};
$("bReset").onclick=()=>ask("Erase all rounds and scores?",()=>api("DELETE","/rounds"));

/* share */
function shareText(){
  const t=totals(),d=new Date().toLocaleDateString("en-GB");
  return `🃏 UNO scores – ${d} (${rounds.length} round${rounds.length==1?"":"s"})\n\n`+t.map((x,i)=>`${["🥇","🥈","🥉"][i]||(i+1)+"."} ${x.n} – ${x.pts} pts`).join("\n");
}
function makeImage(){
  const t=totals(),W=1080,H=380+t.length*130,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#f6f4ef";x.fillRect(0,0,W,H);
  x.fillStyle="#d72e2e";x.fillRect(0,0,W,210);
  x.fillStyle="#fff";x.font="800 84px system-ui,sans-serif";x.fillText("UNO Scores",60,110);
  x.font="500 36px system-ui,sans-serif";x.fillText(new Date().toLocaleDateString("en-GB")+" · "+rounds.length+" rounds",60,168);
  t.forEach((r,i)=>{const y=250+i*130;
    x.fillStyle="#fff";x.beginPath();x.roundRect(40,y,W-80,112,24);x.fill();
    x.fillStyle="#1d1d1f";x.font="700 52px system-ui,sans-serif";
    x.fillText((["🥇","🥈","🥉"][i])||String(i+1),70,y+74);
    x.fillText(r.n,170,y+74);
    x.font="800 62px system-ui,sans-serif";x.fillStyle=i==0?"#d72e2e":"#1d1d1f";x.textAlign="right";x.fillText(String(r.pts),W-80,y+78);x.textAlign="left"});
  return new Promise(r=>c.toBlob(r,"image/png"));
}
$("bShare").onclick=()=>{$("sWa").href="https://wa.me/?text="+encodeURIComponent(shareText());$("share").classList.add("on")};
$("sClose").onclick=()=>$("share").classList.remove("on");
$("sImg").onclick=async()=>{
  try{const b=await makeImage(),f=new File([b],"uno-scores.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:shareText()});return}
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="uno-scores.png";a.click();toast("Image saved")}
  catch(e){if(e.name!=="AbortError")toast("Sharing not supported here")}};
$("sTxt").onclick=async()=>{
  try{if(navigator.share){await navigator.share({text:shareText()});return}
    await navigator.clipboard.writeText(shareText());toast("Copied")}
  catch(e){if(e.name!=="AbortError")toast("Could not share")}};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",1800)}
render();pull();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
